name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest==9.2.0 pyyaml==6.0.4
      - run: python -m pytest -q
  claude-code-on-macos-python:  # the python3 that macOS ships, 3.9 for years; Hermes's side needs 3.11
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: /usr/bin/python3 --version && /usr/bin/python3 -m venv venv && venv/bin/pip install pytest==8.4.2
      - run: venv/bin/python -m pytest -q tests/test_polymetis_claude.py
